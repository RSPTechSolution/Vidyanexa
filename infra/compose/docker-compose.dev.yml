name: eduvia

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduvia_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduvia            # owner / migration role (superuser)
      POSTGRES_PASSWORD: eduvia_owner_dev
      POSTGRES_DB: eduvia
    ports: ["5433:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvia -d eduvia"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: eduvia_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6380:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # A local stand-in for the file bucket (Cloudflare R2 in production): the same S3 API, at http://localhost:9090.
  # Only needed with STORAGE_BACKEND=s3, and by the storage tests. It accepts any keys.
  s3:
    image: adobe/s3mock:5.2.2
    container_name: eduvia_s3
    restart: unless-stopped
    ports: ["9090:9090"]


volumes:
  pg_data:
  redis_data:
