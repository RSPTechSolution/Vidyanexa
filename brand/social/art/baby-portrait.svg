    <path d="M258 262 C268 200 300 140 346 94" stroke="#3E2E28" stroke-width="3"/>
    <path d="M288 252 C300 196 322 140 352 92" stroke="#121010" stroke-width="5"/>
    <path d="M318 246 C326 190 340 136 356 92" stroke="#4E3C35" stroke-width="2.4"/>
    <path d="M350 240 C352 186 356 132 360 92" stroke="#121010" stroke-width="4"/>
    <path d="M382 238 C380 184 372 134 364 92" stroke="#5A463E" stroke-width="2.2"/>
    <path d="M414 244 C406 190 390 138 368 94" stroke="#121010" stroke-width="5"/>
    <path d="M446 250 C432 196 406 142 372 96" stroke="#4E3C35" stroke-width="2.6"/>
    <path d="M476 262 C458 204 424 150 378 98" stroke="#121010" stroke-width="4"/>
    <path d="M240 292 C246 220 284 150 342 98" stroke="#121010" stroke-width="4"/>
    <path d="M496 290 C484 220 444 156 382 100" stroke="#3E2E28" stroke-width="3"/>
    <path d="M300 200 C312 160 330 128 350 100" stroke="#6A564C" stroke-width="1.8" opacity=".8"/>
    <path d="M430 206 C418 166 398 134 372 102" stroke="#6A564C" stroke-width="1.8" opacity=".8"/>
  </g>
  <!-- wisps on the forehead and by the ears -->
  <g stroke="#231814" stroke-linecap="round" fill="none">
    <path d="M262 258 Q256 278 266 294" stroke-width="3"/><path d="M280 250 Q276 268 284 280" stroke-width="2"/><path d="M314 244 Q310 262 318 272" stroke-width="2"/><path d="M372 238 Q376 256 370 266" stroke-width="2"/><path d="M392 240 Q398 258 392 270" stroke-width="2"/><path d="M432 246 Q440 262 436 276" stroke-width="2"/><path d="M296 252 Q292 272 300 284" stroke-width="2.5"/>
    <path d="M330 250 Q334 266 328 278" stroke-width="2.2"/><path d="M412 250 Q420 266 414 278" stroke-width="2.2"/>
    <path d="M452 258 Q462 272 458 288" stroke-width="2.5"/>
    <path d="M236 300 Q230 330 238 350" stroke-width="4"/>
    <path d="M498 290 Q518 330 510 372 Q506 392 516 408" stroke-width="4"/><path d="M490 296 Q506 330 500 360" stroke-width="3"/>
  </g>
  <!-- the top-knot: one tuft gathered at the crown, leaning back to the left -->
  <path d="M336 92 C326 66 304 46 284 34 C304 36 318 42 328 40 C324 24 326 10 336 0 C342 14 348 24 356 30 C364 18 378 10 394 10 C382 26 374 50 372 92 Z" fill="#1E1411"/>
  <g stroke="#4B3A33" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8"><path d="M348 88 Q336 50 304 40"/><path d="M354 88 Q346 40 338 10"/><path d="M362 88 Q366 44 384 18"/></g>
  <g transform="translate(352 60)">
    <ellipse cx="0" cy="-13" rx="9" ry="12" fill="#E8879A"/><ellipse cx="13" cy="-2" rx="12" ry="9" fill="#E8879A"/>
    <ellipse cx="7" cy="12" rx="9" ry="11" fill="#E8879A" transform="rotate(-30 7 12)"/><ellipse cx="-8" cy="12" rx="9" ry="11" fill="#E8879A" transform="rotate(30 -8 12)"/>
    <ellipse cx="-13" cy="-2" rx="12" ry="9" fill="#E8879A"/><circle r="7" fill="#C9576E"/>
