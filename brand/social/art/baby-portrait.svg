  <circle cx="305" cy="327" r="23" fill="url(#eye)"/>
  <circle cx="313" cy="318" r="6.5" fill="#fff"/><circle cx="298" cy="334" r="2.2" fill="#fff" opacity=".8"/>
  <path d="M272 326 Q302 294 337 323" stroke="#1A0F0C" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M276 306 Q304 288 334 304 M388 302 Q418 286 448 302" stroke="#9E6447" stroke-width="2.5" fill="none" opacity=".5"/>
