  <circle cx="338" cy="378" r="12" fill="#C98C66"/><circle cx="386" cy="378" r="12" fill="#C98C66"/>
  <ellipse cx="362" cy="370" rx="27" ry="20" fill="#D8A27D"/>
  <ellipse cx="356" cy="362" rx="9" ry="6" fill="#E6B793" opacity=".8"/>
  <path d="M328 376 Q332 392 348 390 Q362 396 376 390 Q392 392 396 376" stroke="#9E6447" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="349" cy="384" rx="6.5" ry="4" fill="#6E3E2C"/><ellipse cx="375" cy="384" rx="6.5" ry="4" fill="#6E3E2C"/>
  <!-- full cheeks -->
  <ellipse cx="276" cy="400" rx="36" ry="26" fill="#E08A78" opacity=".28"/><ellipse cx="452" cy="398" rx="36" ry="26" fill="#E08A78" opacity=".28"/>
  <!-- small closed mouth, upper lip with a soft bow -->
  <path d="M358 396 L358 412" stroke="#B37552" stroke-width="3" opacity=".35"/>
  <path d="M334 426 Q346 412 357 417 Q363 413 369 417 Q380 412 392 426 Q363 424 334 426 Z" fill="#A65651"/>
  <path d="M340 427 Q363 446 386 427 Q363 431 340 427 Z" fill="#B8696A"/>
  <ellipse cx="363" cy="434" rx="8" ry="3" fill="#CF8682" opacity=".7"/>
