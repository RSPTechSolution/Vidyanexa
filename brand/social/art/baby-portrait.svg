  <path d="M410 546 Q404 566 398 582" stroke="#141012" stroke-width="2.5" fill="none"/>
  <ellipse cx="411" cy="544" rx="8" ry="6" fill="#DDE1E7" stroke="#8C93A0" stroke-width="1.5"/>
