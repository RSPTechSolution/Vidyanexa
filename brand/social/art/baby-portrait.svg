    <path d="M690 632 L712 642"/><path d="M698 654 L718 664"/><path d="M692 676 L708 690"/><path d="M640 626 L650 604"/>
  </g>
  <g stroke="#A86B4D" stroke-width="2" fill="none" opacity=".6"><path d="M690 632 L712 642 M698 654 L718 664 M692 676 L708 690"/></g>
  <path d="M590 632 Q600 655 596 684" stroke="#1A1416" stroke-width="3.5" fill="none"/>

  <!-- ears -->
  <ellipse cx="224" cy="338" rx="24" ry="38" fill="#C2845F" transform="rotate(-8 224 338)"/>
  <path d="M230 312 Q210 338 228 366" stroke="#9E6447" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="500" cy="336" rx="15" ry="30" fill="#BD805C"/>

  <!-- head: round, full cheeks, small soft chin -->
  <path d="M234 300 C226 180 290 88 366 88 C446 88 506 170 500 300 C503 360 499 402 486 426 C470 456 430 478 366 482 C300 482 262 458 246 426 C234 400 233 360 234 300 Z" fill="url(#face)"/>
  <path d="M318 474 Q366 486 414 474" stroke="#A86B4D" stroke-width="3" fill="none" opacity=".5"/>

