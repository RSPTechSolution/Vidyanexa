  <path d="M387 325 Q418 295 450 323 Q418 353 387 325 Z" fill="#F4ECE4"/>
  <circle cx="417" cy="325" r="23" fill="url(#eye)"/>
  <circle cx="425" cy="316" r="6.5" fill="#fff"/><circle cx="410" cy="332" r="2.2" fill="#fff" opacity=".8"/>
  <path d="M386 324 Q418 292 451 322" stroke="#1A0F0C" stroke-width="6" fill="none" stroke-linecap="round"/>
