    <path d="M-20 -14 l6 -10 l6 8 M-2 -19 l6 -10 l6 8 M14 -18 l7 -8 l4 10" fill="#3DAA6E" stroke="#3DAA6E" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-8" cy="2" r="3" fill="#2B2238"/><circle cx="12" cy="2" r="3" fill="#2B2238"/>
    <ellipse cx="-16" cy="12" rx="5" ry="3" fill="#F29BB4"/><ellipse cx="22" cy="12" rx="5" ry="3" fill="#F29BB4"/>
  </g>
  <text transform="translate(440 790) rotate(-9)" text-anchor="middle" font-family="Ink Free, Comic Sans MS, cursive" font-weight="700" font-size="62" letter-spacing="1">
    <tspan fill="#EE7FA6">s</tspan><tspan fill="#9C5BC9">q</tspan><tspan fill="#3DAA6E">u</tspan><tspan fill="#E8559A">i</tspan><tspan fill="#9C5BC9">s</tspan><tspan fill="#3DAA6E">h</tspan>
  </text>
  <g fill="#3DAA6E"><path transform="translate(342 728) scale(.6)" d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z"/><path transform="translate(352 800) scale(.5)" d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z"/></g>

  <!-- arm on the left, hanging down to the blanket, black bead bracelet -->
  <path d="M248 468 C192 468 150 500 125 560 C100 630 94 720 100 790 C100 832 120 852 150 850 C176 848 180 822 170 802 C180 742 205 690 226 645 Z" fill="url(#limb)"/>
  <path d="M120 700 Q130 690 142 700" stroke="#A86B4D" stroke-width="3" fill="none" opacity=".55"/>
  <path d="M96 826 C90 852 108 872 136 874 C160 876 176 862 172 840 C168 822 120 816 96 826 Z" fill="#C2855F"/>
  <path d="M112 868 l-4 10 M128 872 l-2 10 M144 870 l0 9" stroke="#C2855F" stroke-width="9" stroke-linecap="round"/>
  <path d="M95 805 Q130 822 170 812" stroke="#1A1416" stroke-width="7" stroke-dasharray="0.1 10" stroke-linecap="round" fill="none"/>
