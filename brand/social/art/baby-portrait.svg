<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -10 700 1135" width="700" height="1135">
  <!-- Picture-book portrait of the baby in cute_baby.jpeg, drawn in the photo's own coordinates (720x1280) so the
       face, hair, pose and clothes line up with it: round face with full cheeks, wet hair combed up into a top-knot
       with a pink flower clip, big dark eyes, button nose, small closed mouth, black-thread necklace, cream
       polka-dot "squish" romper, bead bracelets and anklets, sitting cross-legged on a blue blanket. -->
  <defs>
    <pattern id="dots" width="34" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <circle cx="6" cy="6" r="3.6" fill="#DE6F55"/><circle cx="23" cy="21" r="3.6" fill="#DE6F55"/>
    </pattern>
    <radialGradient id="face" cx="48%" cy="58%" r="60%">
      <stop offset="0" stop-color="#DCA581"/><stop offset=".7" stop-color="#D09572"/><stop offset="1" stop-color="#BE805D"/>
    </radialGradient>
    <radialGradient id="limb" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#D29873"/><stop offset="1" stop-color="#B9795A"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#3B2620"/><stop offset=".7" stop-color="#1C120F"/><stop offset="1" stop-color="#0D0807"/>
    </radialGradient>
    <clipPath id="romperClip"><path id="romperPath" d="M245 452 L288 448 Q300 560 370 606 Q440 588 468 446 L506 452 Q520 515 546 560 Q570 680 602 790 Q628 832 600 852 Q520 902 380 926 Q240 920 160 884 Q128 862 150 822 Q174 742 200 680 Q214 650 226 640 Q232 560 245 452 Z"/></clipPath>
    <linearGradient id="hair" x1="0" y1="80" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1411"/><stop offset=".55" stop-color="#241814" stop-opacity=".92"/><stop offset=".85" stop-color="#2A1C17" stop-opacity=".55"/><stop offset="1" stop-color="#2A1C17" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <!-- blanket -->
  <ellipse cx="380" cy="1040" rx="345" ry="82" fill="#1E5C8A"/>
  <ellipse cx="380" cy="1040" rx="318" ry="66" fill="none" stroke="#2F77A8" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
  <g stroke="#2F77A8" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M60 1000 q12 -8 24 0"/><path d="M640 985 q12 -8 24 0"/><path d="M600 1060 q12 -8 24 0"/><path d="M120 1080 q12 -8 24 0"/><path d="M690 1040 q10 -6 20 0"/>
  </g>

  <!-- thighs under the bloomers -->
  <path d="M150 860 Q380 940 610 830 Q640 900 560 940 Q500 975 440 990 Q380 1000 320 1000 Q230 996 180 960 Q140 920 150 860 Z" fill="#BF8160"/>
  <path d="M250 975 Q340 990 430 975" stroke="#A86B4D" stroke-width="3" fill="none" opacity=".45"/>
  <!-- leg on the right (behind), shin running in to the ankle -->
  <path d="M520 838 C600 798 702 828 686 906 C676 962 610 998 500 1006 C458 1009 434 990 440 965 C446 944 470 939 500 934 C560 924 590 904 585 884 Z" fill="url(#limb)"/>
  <path d="M640 870 Q660 900 650 930" stroke="#A86B4D" stroke-width="3" fill="none" opacity=".5"/>
  <!-- black bead anklet with a gold bead -->
  <g fill="#1A1416"><circle cx="415" cy="968" r="5"/><circle cx="426" cy="972" r="5"/><circle cx="437" cy="976" r="5"/><circle cx="448" cy="981" r="5"/><circle cx="459" cy="986" r="5"/></g>
  <circle cx="469" cy="991" r="5.5" fill="#D9A93F"/>

  <!-- leg on the left: thigh, knee out to the side, shin across the front, foot on top with toes to the right -->
  <path d="M205 850 C122 838 60 880 62 950 C64 1012 132 1050 252 1060 L330 1062 C382 1070 420 1110 480 1112 C520 1114 536 1090 526 1068 C516 1040 482 1010 432 1000 C392 980 352 984 322 982 C252 976 196 962 176 940 C166 924 186 900 216 890 Z" fill="url(#limb)"/>
  <path d="M95 930 Q110 960 140 972" stroke="#A86B4D" stroke-width="3" fill="none" opacity=".5"/>
  <path d="M352 1010 Q440 1000 500 1050" stroke="#E2B08E" stroke-width="10" fill="none" stroke-linecap="round" opacity=".55"/>
  <g fill="#D7A07D" stroke="#B47A5A" stroke-width="2">
    <ellipse cx="514" cy="1062" rx="12" ry="10"/><ellipse cx="520" cy="1082" rx="11" ry="9"/><ellipse cx="510" cy="1100" rx="10" ry="8.5"/><ellipse cx="492" cy="1110" rx="9" ry="7.5"/>
  </g>
  <!-- black-and-white bead anklet -->
  <g stroke="#1A1416" stroke-width="1.5">
    <circle cx="288" cy="1058" r="6.5" fill="#1A1416"/><circle cx="298" cy="1049" r="6.5" fill="#F7F3EE"/><circle cx="308" cy="1041" r="6.5" fill="#1A1416"/>
    <circle cx="318" cy="1033" r="6.5" fill="#F7F3EE"/><circle cx="329" cy="1026" r="6.5" fill="#1A1416"/><circle cx="340" cy="1020" r="6.5" fill="#F7F3EE"/>
    <circle cx="352" cy="1015" r="6.5" fill="#1A1416"/><circle cx="364" cy="1012" r="6.5" fill="#F7F3EE"/>
  </g>

  <!-- chest skin showing in the scoop neck, and the shadow under the chin -->
  <path d="M250 450 L490 450 Q470 560 370 612 Q280 560 250 450 Z" fill="#C2855F"/>
  <ellipse cx="362" cy="488" rx="92" ry="22" fill="#9E6447" opacity=".55"/>

  <!-- romper -->
  <use href="#romperPath" fill="#F4DFAF"/>
  <g clip-path="url(#romperClip)">
    <rect x="100" y="420" width="560" height="540" fill="url(#dots)"/>
    <path d="M150 792 Q380 840 606 786" stroke="#E6C88C" stroke-width="5" fill="none"/>
    <path d="M150 800 Q380 848 606 794" stroke="#FFF2CF" stroke-width="3" fill="none" opacity=".7"/>
    <path d="M200 840 Q230 880 225 915 M300 860 Q320 890 315 925 M450 860 Q440 890 448 920 M540 830 Q530 860 540 880" stroke="#E2C080" stroke-width="3" fill="none" opacity=".8"/>
    <path d="M226 640 Q300 700 330 760" stroke="#E2C080" stroke-width="3" fill="none" opacity=".6"/>
  </g>
  <!-- ribbed trim on the straps and neck -->
  <path d="M245 452 Q232 560 226 640 M288 448 Q300 560 370 606 Q440 588 468 446 M506 452 Q520 515 546 560" stroke="#E4C584" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M245 452 Q232 560 226 640 M288 448 Q300 560 370 606 Q440 588 468 446 M506 452 Q520 515 546 560" stroke="#F8E8C2" stroke-width="2" fill="none" stroke-dasharray="2 6"/>
