<!doctype html>
<!-- An Instagram feed post (1080x1350), rendered by web/scripts/social/posts.mjs. Parameters arrive in the hash as
     URL-encoded JSON: layout (phone | browser), kicker, title (*gold words*), sub, badge (*gold words*), img (screen). -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Cinzel; src: url("../../web/src/fonts/Cinzel-SemiBold.ttf"); font-weight: 600; }
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1350px; overflow: hidden; color: #15233F; font-family: "Segoe UI", Arial, sans-serif; }
.page { position: relative; height: 100%; padding: 80px 80px 0; overflow: hidden;
  background: radial-gradient(900px 600px at 100% 0%, rgba(184,137,60,.20), transparent 60%),
              radial-gradient(700px 600px at 0% 100%, rgba(21,35,63,.08), transparent 60%), #F7F2E8; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand img { width: 54px; }
.word { font-family: Cinzel; font-weight: 600; font-size: 30px; letter-spacing: .08em; }
.kicker { margin-top: 58px; font-size: 24px; letter-spacing: .22em; color: #B8893C; font-weight: 700; }
h1 { margin-top: 16px; font-family: Georgia, serif; font-size: 74px; line-height: 1.06; letter-spacing: -.01em; max-width: 920px; }
h1 em, .badge em { font-style: normal; color: #B8893C; }
.badge em { color: #E2BE74; }
.sub { margin-top: 22px; font-size: 29px; line-height: 1.45; color: #5B6478; }
/* phone layout: text on the left column, phone on the right reaching off the bottom */
.phone-layout h1, .phone-layout .sub { max-width: 470px; }
.phone-layout h1 { font-size: 64px; }
.phone-layout .sub { font-size: 27px; }
.phone { position: absolute; right: 64px; top: 250px; width: 470px; border: 14px solid #15233F; border-radius: 62px; overflow: hidden; background: #fff;
  box-shadow: 0 50px 100px -25px rgba(21,35,63,.55), 0 0 0 2px #2a3a5e; }
.phone img { display: block; width: 100%; }
.phone-layout .badge { left: 56px; bottom: 150px; max-width: 600px; }
/* browser layout: text on top, a wide browser below */
.browser { position: absolute; left: 80px; top: 650px; width: 1300px; border-radius: 22px; overflow: hidden; background: #fff;
  box-shadow: 0 40px 90px -20px rgba(21,35,63,.45), 0 0 0 1px rgba(21,35,63,.08); }
.bar { height: 40px; background: #EDE7DA; display: flex; gap: 9px; align-items: center; padding: 0 18px; }
.bar i { width: 13px; height: 13px; border-radius: 50%; background: #d8cfbd; }
.browser img { display: block; width: 100%; }
.browser-layout .badge { left: 56px; bottom: 90px; }
.browser-layout .foot { left: auto; right: 80px; bottom: auto; top: 96px; }
.badge { position: absolute; background: #15233F; color: #F7F2E8; border-radius: 20px; padding: 24px 30px; font-size: 28px; line-height: 1.3;
  box-shadow: 0 22px 44px -10px rgba(21,35,63,.5); z-index: 2; }
.foot { position: absolute; left: 80px; bottom: 44px; font-size: 22px; color: #5B6478; letter-spacing: .03em; z-index: 1; }
.foot b { color: #15233F; }
</style></head>
<body><div class="page" id="page">
  <div class="brand"><img src="../png/vidyanexa-crest.png" alt=""><div class="word">VIDYANEXA</div></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div id="screen"></div>
  <div class="badge" id="badge"></div>
  <div class="foot"><b>vidyanexa.com</b> · free 14-day trial</div>
</div>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
  const gold = (s) => (s || "").replace(/\*(.+?)\*/g, "<em>$1</em>");
  document.getElementById("page").classList.add(`${p.layout || "phone"}-layout`);
  document.getElementById("kicker").textContent = p.kicker || "";
  document.getElementById("title").innerHTML = gold(p.title);
  document.getElementById("sub").textContent = p.sub || "";
  document.getElementById("badge").innerHTML = gold(p.badge);
  document.getElementById("screen").innerHTML = p.layout === "browser"
    ? `<div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="${p.img}" alt=""></div>`
    : `<div class="phone"><img src="${p.img}" alt=""></div>`;
</script>
</body></html>
