<!doctype html>
<!-- One template, several layers, each screenshotted at 1080x1920 by web/scripts/social/reels.mjs and stacked by ffmpeg:
     #layer=bg      the background, brand, kicker and headline (the recording goes on top of this)
     #layer=frame   the phone bezel, transparent where the screen is
     #layer=caption one step caption (transparent around it)
     #layer=end     the closing card
     Parameters come in the hash as URL-encoded JSON: #{"layer":"bg","kicker":"ATTENDANCE","title":"…","em":"…"}
     theme: "diwali" gives the festive look of the Diwali posts (brand/social/diwali-template.html); theme: "childrens" the
     picture-book look of the Children's Day posts (childrens-day-template.html, artwork in art/kids.js); theme: "diwalibook"
     the same picture-book look dressed for Diwali (marigolds, lanterns, diyas, rangoli); cta sets the end button. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Cinzel; src: url("../../web/src/fonts/Cinzel-SemiBold.ttf"); font-weight: 600; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
body { color: #15233F; font-family: "Segoe UI", Arial, sans-serif; }
.bg { position: absolute; inset: 0;
  background: radial-gradient(900px 700px at 100% 0%, rgba(184,137,60,.20), transparent 60%),
              radial-gradient(800px 700px at 0% 100%, rgba(21,35,63,.10), transparent 60%), #F7F2E8; }
.brand { position: absolute; left: 80px; top: 78px; display: flex; align-items: center; gap: 16px; }
.brand img { width: 54px; }
.word { font-family: Cinzel; font-weight: 600; font-size: 30px; letter-spacing: .08em; }
.kicker { position: absolute; left: 80px; top: 196px; font-size: 26px; letter-spacing: .22em; color: #B8893C; font-weight: 700; }
h1 { position: absolute; left: 80px; right: 80px; top: 240px; font-family: Georgia, serif; font-size: 66px; line-height: 1.08; letter-spacing: -.01em; }
h1 em { font-style: normal; color: #B8893C; }
.foot { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 28px; color: #5B6478; letter-spacing: .02em; }
.foot b { color: #15233F; }
/* The phone: screen 560 x 1212 at (260, 500); bezel 16px around it. */
.phone { position: absolute; left: 244px; top: 484px; width: 592px; height: 1244px; border-radius: 74px; border: 16px solid #15233F;
  box-shadow: 0 0 0 2px #2a3a5e; }
.phone-shadow { position: absolute; left: 244px; top: 484px; width: 592px; height: 1244px; border-radius: 74px;
  box-shadow: 0 60px 120px -30px rgba(21,35,63,.55); background: #fff; }
/* The bezel layer also paints the corners outside the rounded screen, so the square recording looks rounded. */
.mask { position: absolute; left: 260px; top: 500px; width: 560px; height: 1212px; border-radius: 58px; box-shadow: 0 0 0 40px #15233F; }
.notch { position: absolute; left: 470px; top: 512px; width: 140px; height: 34px; border-radius: 20px; background: #15233F; }
.caption { position: absolute; left: 90px; right: 90px; bottom: 300px; display: flex; justify-content: center; }
.pill { display: inline-flex; align-items: center; gap: 18px; background: #15233F; color: #F7F2E8; border-radius: 28px; padding: 26px 36px;
  font-size: 38px; line-height: 1.25; box-shadow: 0 24px 50px -12px rgba(21,35,63,.6); max-width: 900px; }
.pill .tick { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #B8893C; color: #15233F; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
.pill b { color: #E2BE74; }
.end { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  background: radial-gradient(900px 700px at 50% 30%, rgba(184,137,60,.28), transparent 65%), #15233F; color: #F7F2E8; }
.end .crest { width: 170px; margin: 0 auto 34px; }
.end .w { font-family: Cinzel; font-weight: 600; font-size: 64px; letter-spacing: .1em; }
.end .line { margin-top: 26px; font-size: 40px; color: #D9C9A6; }
.end .cta { display: inline-block; margin-top: 70px; padding: 30px 54px; border-radius: 60px; background: #B8893C; color: #15233F; font-size: 40px; font-weight: 700; }
.end .url { margin-top: 34px; font-size: 34px; letter-spacing: .04em; }
[hidden] { display: none !important; }

/* ---- Diwali theme ---- */
.diwali body { color: #F7F2E8; }
.diwali .bg { background:
    radial-gradient(700px 520px at 50% 104%, rgba(255,170,60,.40), transparent 70%),
    radial-gradient(800px 600px at 100% 0%, rgba(184,137,60,.32), transparent 62%),
    radial-gradient(700px 700px at 0% 45%, rgba(150,40,90,.22), transparent 65%),
    linear-gradient(180deg, #0F1A31 0%, #15233F 55%, #24233A 100%); }
.diwali .brand { top: 122px; }
.diwali .kicker { top: 226px; color: #E2BE74; }
.diwali h1 { top: 270px; font-size: 64px; }
.diwali h1 em { color: #F1C76E; text-shadow: 0 0 34px rgba(255,190,90,.45); }
.diwali .foot { color: #CFC8B8; }
.diwali .foot b { color: #F7F2E8; }
.diwali .phone { box-shadow: 0 0 0 3px #E2BE74, 0 0 60px rgba(241,199,110,.25); }
.diwali .phone-shadow { box-shadow: 0 60px 120px -30px rgba(0,0,0,.7); }
.diwali .pill { background: #15233F; border: 2px solid #E2BE74; box-shadow: 0 24px 60px -10px rgba(0,0,0,.6), 0 0 40px rgba(241,199,110,.25); }
.diwali .pill .tick { background: #F1C76E; }
.diwali .end { background:
    radial-gradient(700px 520px at 50% 100%, rgba(255,170,60,.40), transparent 70%),
    radial-gradient(900px 700px at 50% 30%, rgba(184,137,60,.30), transparent 65%), #13203A; }
.diwali .end .cta { background: linear-gradient(90deg, #F1C76E, #E2A94C); box-shadow: 0 20px 50px -12px rgba(241,199,110,.6); }
.end > div:not(.deco) { position: relative; z-index: 1; }
.deco { position: absolute; inset: 0; pointer-events: none; }
.deco .lights { position: absolute; left: 0; top: 0; width: 1080px; height: 110px; }
.deco .rangoli { position: absolute; width: 560px; height: 560px; opacity: .38; }
.deco .diyas { position: absolute; display: flex; align-items: flex-end; gap: 22px; }
.deco .diya { position: relative; }
.deco .glow { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,196,90,.55), rgba(255,140,40,.12) 45%, transparent 70%); }
.deco .sparkle { position: absolute; color: #F1C76E; }

/* ---- Children's Day theme: cream paper, bunting, hand-drawn children (art/kids.js) ---- */
.childrens .bg { background: radial-gradient(1000px 900px at 50% 30%, #FFF9EC, #FBF0DC 70%, #F6E6C9); }
.childrens .brand { top: 128px; }
.childrens .kicker { top: 230px; color: #B07A2A; }
.childrens h1 { top: 272px; font-size: 68px; color: #15233F; }
.childrens h1 em, .childrens .end .big em { font-style: normal; font-family: "Ink Free", "Segoe Print", "Comic Sans MS", cursive; font-weight: 700; filter: url(#rough); }
.childrens h1 em span, .childrens .end .big em span { display: inline-block; }
.childrens h1 em { font-size: 86px; }
.childrens .foot { bottom: 48px; color: #EAF6E4; z-index: 2; }
.childrens .foot b { color: #fff; }
.childrens .phone-shadow { box-shadow: 0 50px 110px -30px rgba(21,35,63,.45); }
.childrens .pill { background: #15233F; border: 3px solid #fff; box-shadow: 0 22px 50px -12px rgba(21,35,63,.55); }
.childrens .pill .tick { background: #3DB57E; color: #fff; }
.childrens .pill b { color: #FFD66B; }
.childrens .end { background: radial-gradient(1000px 900px at 50% 30%, #FFF9EC, #FBF0DC 70%, #F6E6C9); color: #15233F; align-items: start; padding-top: 250px; }
.childrens .end .w { color: #15233F; }
.childrens .end .big { font-family: Georgia, serif; font-size: 84px; line-height: 1.05; margin: 40px 0 0; color: #15233F; }
.childrens .end .big em { display: block; font-size: 128px; margin-top: 6px; }
.childrens .end .line { color: #4A5165; margin-top: 30px; }
.childrens .end .cta { background: #15233F; color: #FFF9EC; margin-top: 48px; }
.childrens .end .url { color: #15233F; }
/* Diwali in the picture-book look: the Children's Day styles, warmer accents, a terracotta courtyard floor */
.diwalibook .kicker { color: #B5462F; }
.diwalibook h1 em { margin-left: .18em; }
.diwalibook .foot { color: #FFE9CF; }
.diwalibook .foot b { color: #fff; }
.diwalibook .pill .tick { background: #F29E38; }
.diwalibook .end .big em { font-size: 150px; }
.grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }
.kidsart { position: absolute; inset: 0; pointer-events: none; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .22 0"/></filter>
</svg>
<div id="bg" hidden>
  <div class="bg"></div>
  <div class="brand"><img src="../png/vidyanexa-crest.png" alt=""><div class="word">VIDYANEXA</div></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="phone-shadow"></div>
  <div class="foot"><b>vidyanexa.com</b> · School management, made simple</div>
</div>
<div id="frame" hidden><div class="mask"></div><div class="phone"></div></div>
<div id="caption" hidden><div class="caption"><div class="pill"><span class="tick">✓</span><span id="ctext"></span></div></div></div>
<div id="end" hidden><div class="end"><div>
  <img class="crest" src="../png/vidyanexa-crest-reverse.png" alt="">
  <div class="w">VIDYANEXA</div>
  <div class="line" id="eline">School management software for Indian schools</div>
  <div class="cta">Start your free 14-day trial</div>
  <div class="url">www.vidyanexa.com</div>
</div></div></div>
<script src="art/kids.js"></script>
<script>
  const p = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
  const layer = document.getElementById(p.layer || "bg");
  layer.hidden = false;
  if (p.cta) document.querySelector(".end .cta").textContent = p.cta;
  if (p.theme === "diwali") {
    document.documentElement.classList.add("diwali");
    if (p.layer === "bg") layer.querySelector(".bg").insertAdjacentHTML("afterend", decorations("bg"));
    if (p.layer === "end") layer.querySelector(".end").insertAdjacentHTML("afterbegin", decorations("end"));
  }
  // the picture-book looks: Children's Day, and Diwali drawn in the same hand
  const diw = p.theme === "diwalibook";
  const kids = p.theme === "childrens" || diw;
  const pal = diw ? LET_DIWALI : LET;
  if (kids) {
    document.documentElement.classList.add("childrens");
    if (diw) document.documentElement.classList.add("diwalibook");
    const scene = diw ? diwaliScene : kidsScene;
    if (p.layer === "bg") layer.querySelector(".bg").insertAdjacentHTML("afterend", scene("bg"));
    if (p.layer === "end") {
      const end = layer.querySelector(".end");
      end.insertAdjacentHTML("afterbegin", scene("end"));
      end.querySelector(".crest").src = "../png/vidyanexa-crest.png";
      end.querySelector(".w").insertAdjacentHTML("afterend", `<div class="big">Happy<em>${kid(diw ? "Diwali" : "Children's Day", pal)}</em></div>`);
    }
  }
  // *words* are gold in the brand look, crayon letters in the picture-book looks
  const em = (s) => s.replace(/\*(.+?)\*/g, (_, w) => `<em>${kids ? kid(w, pal) : w}</em>`);
  if (p.kicker) document.getElementById("kicker").textContent = p.kicker;
  if (p.title) document.getElementById("title").innerHTML = em(p.title);
  if (p.caption) document.getElementById("ctext").innerHTML = p.caption.replace(/\*(.+?)\*/g, "<b>$1</b>");
  if (p.line) document.getElementById("eline").textContent = p.line;

  // The Children's Day scene, as in the Children's Day posts. bg: bunting, clouds, a girl with balloons left of the
  // phone and a boy with a kite on the right, on a green hill. end: the four children and the baby on the hill.
  function kidsScene(where) {
    let back = "", front = "", baby = "";
    const grain = `<svg class="grain" viewBox="0 0 1080 1920"><rect width="1080" height="1920" filter="url(#paper)"/></svg>`;
    const girl = { skin: SKIN[0], hair: "braids", ribbon: K.red, top: K.pink, dress: true, eyes: "happy", mouth: "open", l: [-60, -280], r: [40, -112], shoes: "#C2394A" };
    const boy = { skin: SKIN[2], hair: "short", top: K.green, bottom: "#2E4A7A", bag: K.orange, eyes: "dot", mouth: "smile", l: [-40, -112], r: [64, -268] };
    if (where === "bg") {
      const Y = 1830, s = .74;
      back += bunting(22, 26) + cloud(930, 190, .62) + heart(990, 300, 1.3, K.pink, 12) + doodleStar(790, 150, 16, K.purple, 8);
      back += hill(1770, 1960) + tufts([[60, 1850], [990, 1846], [520, 1880]]) + flower(214, 1840, K.pink) + flower(870, 1836, K.orange);
      const hg = hand(126, Y, s, girl.l);
      back += balloon(120, 1170, 50, K.red, hg) + balloon(192, 1080, 44, K.blue, hg) + balloon(76, 1320, 42, K.yellow, hg) + balloon(178, 1400, 34, K.green, hg);
      back += kite(965, 1150, .95, K.purple, K.yellow, hand(955, Y, s, boy.r));
      back += heart(70, 760, 1.5, K.red, -14) + doodleStar(1000, 820, 20, K.orange, -8) + swirl(40, 600, K.blue) + cloud(140, 980, .6) + heart(1010, 1500, 1.2, K.yellow, 10);
      front += child(126, Y, s, girl) + child(955, Y, s, boy);
    } else {
      const Y = 1830, s = .9, X = [150, 340, 740, 930];
      back += bunting(22, 30) + cloud(160, 160, .8) + cloud(940, 220, .7) + doodleStar(860, 120, 18, K.purple, 10) + heart(120, 300, 1.5, K.pink, -12);
      back += hill(1700, 1960) + tufts([[90, 1790], [330, 1770], [760, 1800], [1000, 1776]]) + flower(60, 1760, K.pink) + flower(1030, 1752, K.purple);
      const h1 = hand(X[0], Y, s, girl.l), h4 = hand(X[3], Y, s, boy.r);
      back += balloon(110, 1200, 44, K.red, h1) + balloon(190, 1140, 40, K.blue, h1) + balloon(60, 1320, 36, K.yellow, h1);
      back += kite(990, 1220, .85, K.purple, K.yellow, h4);
      front += child(X[0], Y, s, girl);
      front += child(X[1], Y, s, { skin: SKIN[1], hair: "patka", patka: K.orange, top: K.blue, bottom: "#24365E", eyes: "dot", mouth: "open", l: [-40, -112], r: [62, -284], badge: K.yellow });
      front += child(X[2], Y - 24, s, { skin: SKIN[3], hair: "bun", ribbon: K.yellow, top: K.purple, dress: true, eyes: "happy", mouth: "open", l: [-66, -282], r: [66, -282], socks: true, shoes: "#4B3B8F" }) + jump(X[2], Y - 18);
      front += child(X[3], Y, s, boy);
      // the baby sits in front, outside the wobble filter so her face stays crisp
      baby = `<image href="art/baby.svg" x="${540 - 110}" y="${1866 - 260}" width="220" height="260"/>`;
    }
    return `<div class="deco kidsart"><svg viewBox="0 0 1080 1920" width="1080" height="1920"><g filter="url(#rough)">${back}${front}</g>${baby}</svg>${grain}</div>`;
  }

  // Diwali in the picture-book look. bg: a marigold toran, paper lanterns and fireworks around the phone, a girl holding a
  // diya and a boy with a sparkler on the courtyard floor. end: the four children and the baby among diyas and a rangoli.
  function diwaliScene(where) {
    let back = "", front = "", baby = "";
    const grain = `<svg class="grain" viewBox="0 0 1080 1920"><rect width="1080" height="1920" filter="url(#paper)"/></svg>`;
    const girl = { skin: SKIN[0], hair: "braids", ribbon: "#F5C53A", top: "#C2417E", dress: true, eyes: "happy", mouth: "open", l: [-40, -112], r: [44, -158], shoes: "#8E2F4F" };
    const patka = { skin: SKIN[1], hair: "patka", patka: "#E8703A", top: "#F5C53A", bottom: "#FFF4E0", trousers: true, eyes: "happy", mouth: "open", l: [-40, -112], r: [62, -284], shoes: "#7A4A2A" };
    const bun = { skin: SKIN[3], hair: "bun", ribbon: "#F29E38", top: "#3DB57E", dress: true, eyes: "happy", mouth: "open", l: [-66, -282], r: [66, -282], socks: true, shoes: "#2E6B4A" };
    const boy = { skin: SKIN[2], hair: "short", top: "#3A8FE0", bottom: "#FFF4E0", trousers: true, eyes: "dot", mouth: "open", l: [-40, -112], r: [62, -276], shoes: "#7A4A2A" };
    if (where === "bg") {
      const Y = 1830, s = .74;
      back += toran(16, 26) + burst(930, 150, 40, "#C2417E") + burst(1010, 215, 22, "#F29E38") + heart(790, 150, 1.2, K.pink, 10);
      back += kandil(110, 780, .9, "#E8505B", "#F5C53A", 520) + marigold(110, 520, 13, "#F29E38") + kandil(196, 1090, .66, "#C2417E", "#F29E38", 860) + marigold(196, 860, 11, "#F5C53A");
      back += burst(905, 640, 44, "#9566E0") + burst(940, 860, 30, "#F29E38") + kandil(1010, 1160, .74, "#3A8FE0", "#F5C53A", 980) + marigold(1010, 980, 12, "#E8703A");
      back += doodleStar(60, 1380, 18, "#F29E38", 8) + doodleStar(1000, 1420, 16, "#C2417E", -10);
      back += floor(1770);
      front += child(126, Y, s, girl) + diya(...hand(126, Y, s, girl.r), .5);
      front += child(955, Y, s, patka) + sparkler(...hand(955, Y, s, patka.r), 62);
      front += diya(230, 1850, .55) + diya(850, 1846, .55);
    } else {
      const Y = 1830, s = .9, X = [150, 340, 740, 930];
      back += toran(16, 30) + kandil(110, 470, .9, "#E8505B", "#F5C53A") + kandil(975, 520, .8, "#3A8FE0", "#F5C53A");
      back += burst(250, 240, 46, "#C2417E") + burst(840, 200, 38, "#F29E38") + burst(190, 1330, 40, "#9566E0") + burst(900, 1300, 48, "#C2417E") + burst(990, 1150, 26, "#F29E38");
      back += floor(1700) + rangoli(540, 1888, 1.25);
      front += child(X[0], Y, s, girl) + diya(...hand(X[0], Y, s, girl.r), .58);
      front += child(X[1], Y, s, patka) + sparkler(...hand(X[1], Y, s, patka.r), 70);
      front += child(X[2], Y - 24, s, bun) + jump(X[2], Y - 18);
      front += child(X[3], Y, s, boy) + sparkler(...hand(X[3], Y, s, boy.r), 70);
      front += diya(60, 1890, .62) + diya(250, 1896, .55) + diya(830, 1896, .55) + diya(1020, 1890, .62);
      // the baby sits in front, outside the wobble filter so her face stays crisp
      baby = `<image href="art/baby.svg" x="${540 - 110}" y="${1866 - 260}" width="220" height="260"/>`;
    }
    return `<div class="deco kidsart"><svg viewBox="0 0 1080 1920" width="1080" height="1920"><g filter="url(#rough)">${back}${front}</g>${baby}</svg>${grain}</div>`;
  }

  // The Diwali decorations: string lights, rangoli, diyas and sparkles (as in diwali-template.html), placed around the phone.
  function decorations(where) {
    const colours = ["#FFCF6B", "#FF8A3D", "#FF5E7E", "#FFE29A", "#7FD1FF"];
    let lights = "";
    for (let s = 0; s < 3; s++) {
      const x0 = s * 360;
      lights += `<path d="M${x0} 8 Q ${x0 + 180} 92 ${x0 + 360} 8" stroke="#3B3A50" stroke-width="2" fill="none"/>`;
      for (let i = 1; i < 9; i++) {
        const t = i / 9, x = x0 + 360 * t, y = 8 + 2 * (1 - t) * t * 84 + 10, c = colours[(i + s) % colours.length];
        lights += `<circle cx="${x}" cy="${y}" r="16" fill="${c}" opacity=".22"/><circle cx="${x}" cy="${y}" r="7" fill="${c}"/>`;
      }
    }
    let petals = "";
    for (const [n, r, len, c] of [[8, 78, 22, "#E2BE74"], [12, 58, 15, "#FF8A3D"], [10, 38, 12, "#D94A7A"], [8, 20, 8, "#F1C76E"]]) {
      for (let i = 0; i < n; i++) petals += `<ellipse cx="0" cy="${-r}" rx="${len / 2.4}" ry="${len}" fill="${c}" transform="rotate(${(360 / n) * i})"/>`;
    }
    petals += `<circle r="9" fill="#F7F2E8"/><circle r="92" fill="none" stroke="#E2BE74" stroke-width="1.5" stroke-dasharray="3 6"/>`;
    const rangoli = (style) => `<svg class="rangoli" style="${style}" viewBox="-100 -100 200 200">${petals}</svg>`;
    const diya = (w) => `<div class="diya" style="width:${w}px"><div class="glow" style="width:${w * 1.7}px;height:${w * 1.7}px;top:${-w * 0.45}px"></div>
      <svg viewBox="0 0 120 110" width="${w}" style="position:relative"><defs>
        <radialGradient id="fl" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".45" stop-color="#FFD15C"/><stop offset="1" stop-color="#FF7A1A"/></radialGradient>
        <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2733A"/><stop offset="1" stop-color="#7E3418"/></linearGradient></defs>
        <path d="M60 6 C 70 22, 74 34, 60 50 C 46 34, 50 22, 60 6 Z" fill="url(#fl)"/><path d="M60 24 C 64 32, 65 38, 60 46 C 55 38, 56 32, 60 24 Z" fill="#FFF9E0"/>
        <path d="M8 58 Q 60 54 112 58 Q 104 98 60 102 Q 16 98 8 58 Z" fill="url(#clay)"/><path d="M8 58 Q 60 54 112 58 Q 60 70 8 58 Z" fill="#E2BE74"/>
        <path d="M22 76 Q 60 86 98 76" stroke="#F1C76E" stroke-width="3" fill="none" opacity=".8"/>
        <circle cx="40" cy="88" r="3" fill="#F1C76E"/><circle cx="60" cy="92" r="3" fill="#F1C76E"/><circle cx="80" cy="88" r="3" fill="#F1C76E"/></svg></div>`;
    const star = (x, y, s) => `<svg class="sparkle" style="left:${x}px;top:${y}px" width="${s}" height="${s}" viewBox="-10 -10 20 20"><path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="currentColor"/></svg>`;
    if (where === "end") {
      return `<div class="deco"><svg class="lights" viewBox="0 0 1080 110">${lights}</svg>${rangoli("left:-280px;top:260px")}${rangoli("right:-280px;bottom:380px")}
        <div class="diyas" style="left:0;right:0;bottom:130px;justify-content:center;gap:40px">${[90, 120, 160, 120, 90].map(diya).join("")}</div>
        ${[[160, 240, 30], [900, 260, 36], [120, 1300, 24], [940, 1180, 28], [520, 190, 20]].map((x) => star(...x)).join("")}</div>`;
    }
    return `<div class="deco"><svg class="lights" viewBox="0 0 1080 110">${lights}</svg>${rangoli("left:-360px;top:980px")}${rangoli("right:-360px;top:560px")}
      <div class="diyas" style="left:24px;bottom:160px;flex-direction:column;align-items:center;gap:34px">${[110, 150].map(diya).join("")}</div>
      <div class="diyas" style="right:24px;bottom:160px;flex-direction:column;align-items:center;gap:34px">${[110, 150].map(diya).join("")}</div>
      ${[[140, 470, 26], [930, 200, 34], [80, 760, 20], [980, 900, 24], [110, 1150, 22], [960, 1260, 18]].map((x) => star(...x)).join("")}</div>`;
  }
</script>
